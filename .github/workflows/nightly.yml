name: Nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COMMONS_LONG: "1"
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash tools/test.sh
      - name: Tournament
        run: godot --headless --path . --script res://tools/tournament.gd -- --games 2000 --a hard --b medium --bidding
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tournament
          path: reports/tournament.csv
      # ADR 0027: full runs by the three strategies on the same seeds, for an hour. It
      # prints how many seeds finished, and fails when mixed > private > collective > 0
      # does not hold past the 90% intervals, or when any run made an illegal move.
      - name: Balance
        timeout-minutes: 90
        run:godot --headless --path . --script res://tools/balance.gd -- --minutes 60 --jobs "$(nproc)" --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: balance
          path: |
            reports/balance.md
            reports/balance_runs.csv
