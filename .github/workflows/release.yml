name: Release

# A version tag on main publishes a release. A pull request that touches packaging
# runs everything except the publishing, so changes can be tried without a tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - export_presets.cfg
      - tools/packaging/**
      - tools/write_notices.gd

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_VERSION: 20251108
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  BUTLER_VERSION: 15.32.0
  BUTLER_SHA256: 2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  on-main:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse tags that are not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nsis zip file curl ca-certificates
      - name: Move export templates to the runner's home
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
      - name: Stamp the version
        run: sed -i "/^config\/name=/a config\/version=\"${VERSION#v}\"" project.godot
      - name: Export
        run: |
          mkdir -p build/windows build/linux build/macos dist itch
          godot --headless --path . --import
          godot --headless --path . --export-release Windows build/windows/Commons.exe
          godot --headless --path . --export-release Linux build/linux/Commons.x86_64
          godot --headless --path . --export-release macOS build/macos/Commons.zip
          godot --headless --path . --script res://tools/write_notices.gd -- "$PWD/THIRD-PARTY-NOTICES.txt"
          test -s THIRD-PARTY-NOTICES.txt
          cp THIRD-PARTY-NOTICES.txt build/windows/
          cp THIRD-PARTY-NOTICES.txt build/linux/
          zip -j build/macos/Commons.zip THIRD-PARTY-NOTICES.txt
      - name: Package Windows
        run: |
          zip -j "dist/Commons-${VERSION}-windows.zip" build/windows/*
          makensis -DVERSION="${VERSION}" -DSOURCE="$PWD/build/windows/Commons.exe" \
            -DNOTICES="$PWD/THIRD-PARTY-NOTICES.txt" \
            -DOUTPUT="$PWD/dist/Commons-${VERSION}-windows-setup.exe" tools/packaging/commons.nsi
      - name: Package Linux
        run: |
          tar -czf "dist/Commons-${VERSION}-linux.tar.gz" -C build/linux .
          (cd build/linux && zip -r ../../itch/linux.zip .)
          base=https://github.com/AppImage
          curl -fsSL -o appimagetool \
            "$base/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl -fsSL -o runtime-x86_64 \
            "$base/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          echo "${APPIMAGE_RUNTIME_SHA256}  runtime-x86_64" | sha256sum -c -
          chmod +x appimagetool
          mkdir -p AppDir
          cp build/linux/* AppDir/
          cp tools/packaging/commons.desktop tools/packaging/commons.svg AppDir/
          ln -s Commons.x86_64 AppDir/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --runtime-file runtime-x86_64 AppDir \
            "dist/Commons-${VERSION}-x86_64.AppImage"
      - name: Check the packaged Linux builds start
        run: |
          mkdir unpacked
          tar -xzf "dist/Commons-${VERSION}-linux.tar.gz" -C unpacked
          bash tools/packaging/smoke.sh unpacked/Commons.x86_64
          chmod +x "dist/Commons-${VERSION}-x86_64.AppImage"
          bash tools/packaging/smoke.sh "dist/Commons-${VERSION}-x86_64.AppImage" --appimage-extract-and-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-zip
          path: build/macos/Commons.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itch-linux
          path: itch/linux.zip
          if-no-files-found: error

  macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-zip
      - name: Build disk image
        run: |
          mkdir -p image dist
          unzip -q Commons.zip -d image
          ln -s /Applications image/Applications
          hdiutil create -volname Commons -srcfolder image -ov -format UDZO \
            "dist/Commons-${VERSION}-macos.dmg"
      - name: Check the app inside the disk image
        run: |
          hdiutil attach "dist/Commons-${VERSION}-macos.dmg" -nobrowse -mountpoint /tmp/commons
          app=/tmp/commons/Commons.app/Contents
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = "${VERSION#v}"
          test -s /tmp/commons/THIRD-PARTY-NOTICES.txt
          bash tools/packaging/smoke.sh "$app/MacOS/Commons"
          hdiutil detach /tmp/commons
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/
          if-no-files-found: error

  windows-check:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Unpack the zip and run the installer
        shell: pwsh
        run: |
          Expand-Archive "dist/Commons-$env:VERSION-windows.zip" -DestinationPath zip
          $setup = Start-Process "dist/Commons-$env:VERSION-windows-setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
      - name: Check both builds start
        shell: bash
        run: |
          bash tools/packaging/smoke.sh zip/Commons.exe
          bash tools/packaging/smoke.sh "$LOCALAPPDATA/Programs/Commons/Commons.exe"
      - name: Check the shortcut and uninstaller
        shell: pwsh
        run: |
          $installed = "$env:LOCALAPPDATA\Programs\Commons"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Commons.lnk"
          if (-not (Test-Path $shortcut)) { throw 'No Start-menu shortcut' }
          $remove = Start-Process "$installed\Uninstall.exe" -ArgumentList '/S', "_?=$installed" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { exit $remove.ExitCode }
          if (Test-Path $shortcut) { throw 'Uninstaller left the shortcut' }

  github-release:
    if: github.ref_type == 'tag'
    needs: [on-main, build, macos, windows-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum Commons-* > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "Commons $VERSION" \
              --notes-file tools/packaging/release-notes.md
          fi

  itch:
    if: github.ref_type == 'tag'
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "::warning::itch.io was not updated: set the BUTLER_API_KEY and ITCH_TARGET secrets."
            exit 0
          fi
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  butler.zip" | sha256sum -c -
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          push() { butler/butler push "$1" "$ITCH_TARGET:$2" --userversion "$VERSION"; }
          push "dist/Commons-${VERSION}-windows.zip" windows
          push macos-zip/Commons.zip mac
          push itch-linux/linux.zip linux
