name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nsis zip file
      - name: Move export templates to the runner's home
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
      - name: Export
        run: |
          mkdir -p build/windows build/linux build/macos dist
          godot --headless --path . --import
          godot --headless --path . --export-release Windows build/windows/Commons.exe
          godot --headless --path . --export-release Linux build/linux/Commons.x86_64
          godot --headless --path . --export-release macOS build/macos/Commons.zip
      - name: Check the Linux build starts
        run: build/linux/Commons.x86_64 --headless --quit
      - name: Package Windows
        run: |
          zip -j "dist/Commons-${GITHUB_REF_NAME}-windows.zip" build/windows/Commons.exe
          makensis -DVERSION="${GITHUB_REF_NAME}" -DSOURCE="$PWD/build/windows/Commons.exe" \
            -DOUTPUT="$PWD/dist/Commons-${GITHUB_REF_NAME}-windows-setup.exe" tools/packaging/commons.nsi
      - name: Package Linux
        run: |
          tar -czf "dist/Commons-${GITHUB_REF_NAME}-linux.tar.gz" -C build/linux .
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          mkdir -p AppDir
          cp build/linux/* AppDir/
          cp tools/packaging/commons.desktop tools/packaging/commons.svg AppDir/
          ln -s Commons.x86_64 AppDir/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            "dist/Commons-${GITHUB_REF_NAME}-x86_64.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-zip
          path: build/macos/Commons.zip
          if-no-files-found: error

  macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-zip
      - name: Build disk image
        run: |
          mkdir -p image dist
          unzip -q Commons.zip -d image
          hdiutil create -volname Commons -srcfolder image -ov -format UDZO \
            "dist/Commons-${GITHUB_REF_NAME}-macos.dmg"
      - name: Check the app starts
        run: |
          app=$(find image -maxdepth 1 -name '*.app' | head -1)
          "$app"/Contents/MacOS/* --headless --quit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/
          if-no-files-found: error

  windows-check:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the zip and the installer
        shell: pwsh
        run: |
          Expand-Archive "dist/Commons-$env:GITHUB_REF_NAME-windows.zip" -DestinationPath zip
          $run = Start-Process zip/Commons.exe -ArgumentList '--headless', '--quit' -Wait -PassThru
          if ($run.ExitCode -ne 0) { exit $run.ExitCode }
          $setup = Start-Process "dist/Commons-$env:GITHUB_REF_NAME-windows-setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $installed = "$env:LOCALAPPDATA\Programs\Commons"
          if (-not (Test-Path "$installed\Commons.exe")) { throw 'Installer did not create Commons.exe' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Commons.lnk")) { throw 'No Start-menu shortcut' }
          $remove = Start-Process "$installed\Uninstall.exe" -ArgumentList '/S', "_?=$installed" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { exit $remove.ExitCode }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Commons.lnk") { throw 'Uninstaller left the shortcut' }

  github-release:
    needs: [build, macos, windows-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum Commons-* > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Commons $GITHUB_REF_NAME" \
            --notes-file tools/packaging/release-notes.md

  itch:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - name: Push to itch.io
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "::notice::Skipped itch.io: set the BUTLER_API_KEY and ITCH_TARGET secrets."
            exit 0
          fi
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          push() { butler/butler push "$1" "$ITCH_TARGET:$2" --userversion "$GITHUB_REF_NAME"; }
          push "dist/Commons-${GITHUB_REF_NAME}-windows.zip" windows
          push "dist/Commons-${GITHUB_REF_NAME}-macos.dmg" mac
          push "dist/Commons-${GITHUB_REF_NAME}-linux.tar.gz" linux
