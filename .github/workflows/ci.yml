name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install -r requirements-dev.txt
      - run: bash tools/lint.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash tools/test.sh
      - name: Smoke tournament
        timeout-minutes: 2
        run: godot --headless --path . --script res://tools/tournament.gd -- --games 200 --a medium --b easy --bidding

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Move export templates to the runner's home
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
      - name: Smoke export
        run: |
          mkdir -p build/windows build/linux
          godot --headless --path . --import
          godot --headless --path . --export-release Windows build/windows/Commons.exe
          godot --headless --path . --export-release Linux build/linux/Commons.x86_64
          test -s build/windows/Commons.exe
          bash tools/packaging/smoke.sh build/linux/Commons.x86_64
